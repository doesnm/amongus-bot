[project]
name = "amongus-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "doesnm", email = "unvalued_spotter@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
]

[project.scripts]
amongus-bot = "amongus_bot:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
