[project]
name = "amongus-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "doesnm", email = "unvalued_spotter@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "greenlet>=3.5.6",
    "poethepoet>=0.49.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
]

[project.scripts]
amongus-bot = "src.main:main"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[tool.poe.tasks]
dev = { script = "src.dev:dev" }

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "watchfiles>=1.3.0",
]
